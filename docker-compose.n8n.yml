# Local development only. n8n generates and persists its encryption key in the volume.
# Keep this volume/key when restoring encrypted credentials.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PORT: "5678"
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
